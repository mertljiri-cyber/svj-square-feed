<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dům spolu – přehled SVJ</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#20283b;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{position:fixed;top:0;bottom:0;width:250px;background:#1d2030;color:#e1e5f2;overflow:auto;padding:22px 12px}.brand{font-size:21px;font-weight:800;padding:3px 14px 25px;color:white}.brand span{color:#77b9f5}.group{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#929bb2;margin:20px 14px 8px}.nav{display:block;width:100%;border:0;text-align:left;background:none;color:#c9cede;padding:10px 13px;border-radius:7px;font-size:14px}.nav:hover,.nav.active{background:#30364b;color:white}.nav i{font-style:normal;display:inline-block;width:27px;color:#a3b3e5}.main{margin-left:250px}.top{height:65px;background:white;border-bottom:1px solid #eceef4;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:650}.avatar{background:#e6f3ff;color:#3285ca;border-radius:9px;padding:11px}.title{background:white;padding:18px 30px;font-size:20px;font-weight:750}.content{padding:28px 30px;max-width:1500px}.notice{background:#e7f3ff;border:1px solid #c7e3fc;color:#315a7a;border-radius:8px;padding:13px 17px;margin-bottom:22px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border-radius:8px;padding:24px 28px;min-width:0;box-shadow:0 2px 12px #26355108}.card h2{font-size:16px;margin:0;line-height:1.4}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #edf0f5;padding-bottom:18px;margin-bottom:10px}.link{border:0;background:none;padding:0;text-decoration:underline;color:#8c96a7;font-size:13px;text-align:right}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;color:#7f899a;font-weight:650}th,td{padding:14px 8px;border-bottom:1px solid #f1f3f6}tr:last-child td{border:0}.badge{display:inline-block;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:700;background:#e9f4ff;color:#3896da}.badge.warning{background:#fff5d6;color:#b88a00}.badge.ok{background:#e5f8ee;color:#42a878}.badge.danger{background:#fde9ee;color:#d84d70}.iconbtn{border:0;background:#f1f4fa;border-radius:6px;padding:7px 10px;color:#72809a}.event{display:flex;justify-content:space-between;border-left:3px solid #60a9e7;margin:14px 0;padding:3px 12px}.event small{display:block;color:#919baa;margin-bottom:5px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f6f8fc;border-radius:8px;padding:15px;flex:1;min-width:125px}.stat strong{display:block;font-size:23px;color:#559fe0}.muted{color:#8791a2;font-size:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.toolbar input{flex:1;min-width:200px}.input,select,textarea{border:1px solid #dfe4ec;border-radius:7px;padding:10px 12px;background:white;color:#20283b}.primary{border:0;background:#438ed1;color:#fff;padding:11px 16px;border-radius:7px;font-weight:700}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}.tab{background:#f2f5f9;color:#657188;border:0;border-radius:6px;padding:8px 12px}.tab.active{background:#e5f3ff;color:#2681c7}.empty{text-align:center;padding:36px;color:#8b95a6}dialog{border:0;border-radius:10px;box-shadow:0 15px 70px #17243d55;max-width:520px;width:calc(100% - 30px);padding:28px}dialog::backdrop{background:#10172599}label{display:block;font-size:14px;font-weight:650;margin:14px 0}label input,label textarea,label select{display:block;width:100%;margin-top:6px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.secondary{background:#edf1f7;border:0;padding:10px 15px;border-radius:7px}.menu-toggle{display:none}@media(max-width:800px){.sidebar{transform:translateX(-100%);z-index:5;width:250px;transition:transform .2s}.sidebar.open{transform:none}.main{margin:0}.menu-toggle{display:inline-block;border:0;background:none;font-size:22px;margin-right:10px}.grid{grid-template-columns:1fr}.content{padding:18px}.top,.title{padding-left:18px;padding-right:18px}}
</style></head><body><aside class="sidebar" id="sidebar"><div class="brand"><span>⌂</span> dům spolu</div><div id="navigation"></div></aside><main class="main"><header class="top"><div><button class="menu-toggle" onclick="document.querySelector('#sidebar').classList.toggle('open')" aria-label="Otevřít menu">☰</button>Ukázkové společenství vlastníků</div><span class="avatar">DS</span></header><div class="title" id="title"></div><div class="content"><div class="notice">Ukázková aplikace · Všechna data jsou fiktivní. Změny zůstávají pouze v tomto prohlížeči.</div><div id="app"></div></div></main><dialog id="dialog"></dialog><script>
const pages=[['Nástěnka','⌂'],['Přehledy','▦'],['Vlastníci a sousedé','♙'],['Dokumenty','▣'],['Adresář kontaktů','☏'],['Kalendář událostí','▦'],['Zprávy','▤'],['Jednotky a místnosti','▧'],['Hlášení a požadavky','⚑'],['Diskuze','☷'],['Ankety','◔'],['Hlasování','◕'],['Shromáždění vlastníků','♟'],['Revize a termíny','◷'],['Fotogalerie','▧'],['Požadavky ke schválení','✓'],['Detail společenství','⌂'],['Přehled poplatků','◈'],['Pokladna','▣'],['Hlídání plateb','◷'],['Datová schránka','✉'],['Koš','♲']];
const initial={reports:[{name:'Nefunkční čip ke dveřím',status:'Nové',type:'Oprava',desc:'Čip u hlavního vchodu nefunguje.'},{name:'Graffiti na fasádě domu',status:'V řešení',type:'Jiné',desc:'Prosíme o odstranění nápisu na fasádě.'},{name:'Nesvítí světlo',status:'Vyřešeno',type:'Oprava',desc:'Osvětlení chodby bylo opraveno.'},{name:'Výměna štítku na zvonku',status:'Vyřešeno',type:'Požadavek',desc:''},{name:'Výměna klíče od sklepů',status:'Archivované',type:'Požadavek',desc:''}], discussions:[{name:'Revitalizace zeleně kolem domu',status:'Otevřená',date:'07. 01. 2025'}],revisions:[{name:'Elektroinstalace společných prostor',status:'Po termínu',date:'01. 03. 2025'},{name:'Provozní revize plynu',status:'Po termínu',date:'01. 05. 2026'},{name:'Provozuschopnost hasicích přístrojů',status:'Po termínu',date:'01. 06. 2026'},{name:'Revize hromosvodu',status:'Po termínu',date:'01. 07. 2026'}],events:[{name:'Odstávka teplé vody',date:'04. – 08. 11. 2026',time:'08:00 – 16:00'},{name:'Schůze výboru',date:'04. 11. 2026',time:'17:30 – 19:00'},{name:'Odečty bytových vodoměrů',date:'13. 11. 2026',time:'16:00 – 18:00'},{name:'Oprava výtahů',date:'19. 11. 2026',time:''},{name:'Rekonstrukce chodníku',date:'20. – 21. 11. 2026',time:''}],docs:['Stanovy a domovní řád','Shromáždění vlastníků','Plány domu','Smlouvy s dodavateli','Všeobecné dokumenty'].map(name=>({name,status:'Složka'}))};
let data;try{data=JSON.parse(localStorage.getItem('dum-spolu-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)};let page='Přehledy',filter='Vše',query='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('dum-spolu-v1',JSON.stringify(data))}function go(p){page=p;filter='Vše';query='';location.hash=encodeURIComponent(p);render();$('#sidebar').classList.remove('open')}function badge(s){let cls=s==='V řešení'?'warning':s==='Po termínu'?'danger':['Vyřešeno','Otevřená'].includes(s)?'ok':'';return `<span class="badge ${cls}">${esc(s)}</span>`}function card(title,action,target,body){return `<section class="card"><div class="cardhead"><h2>${title}</h2><button class="link" onclick="go('${target}')">${action}</button></div>${body}</section>`}function table(rows,cols,key){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>Akce</th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${c[1]==='status'?badge(r[c[1]]):esc(r[c[1]])}</td>`).join('')}<td><button class="iconbtn" aria-label="Detail ${esc(r.name)}" onclick="detail('${key}',${data[key].indexOf(r)})">⌕</button></td></tr>`).join('')}</tbody></table></div>`}function events(){return data.events.map((r,i)=>`<div class="event"><div><small>${esc(r.date)}　${esc(r.time)}</small><strong>${esc(r.name)}</strong></div><button class="iconbtn" onclick="detail('events',${i})" aria-label="Detail ${esc(r.name)}">⌕</button></div>`).join('')}
function dashboard(){return `<div class="grid">${card('⚑　Hlášení nová a v řešení','Zobrazit všechna hlášení','Hlášení a požadavky',table(data.reports.filter(r=>['Nové','V řešení'].includes(r.status)),[['Název hlášení','name'],['Stav','status'],['Typ','type']],'reports'))}${card('☷　Otevřené diskuze','Zobrazit všechny diskuze','Diskuze',table(data.discussions,[['Název diskuze','name'],['Stav','status'],['Vytvořeno','date']],'discussions'))}${card('◷　Revize po termínu a naplánované','Zobrazit všechny revize','Revize a termíny',table(data.revisions,[['Název','name'],['Stav','status'],['Termín','date']],'revisions'))}${card('▦　Události v ukázkovém měsíci','Zobrazit celý kalendář','Kalendář událostí',events())}${card('♙　Vlastníci a jednotky','Zobrazit vlastníky','Vlastníci a sousedé','<div class="stats"><div class="stat"><strong>28</strong>vlastníků a sousedů</div><div class="stat"><strong>26</strong>aktivovaných</div><div class="stat"><strong>26</strong>jednotek a místností</div></div>')}</div>`}
function listing(key,cols,tabs,create){let rows=data[key].filter(r=>(filter==='Vše'||r.status===filter)&&Object.values(r).join(' ').toLocaleLowerCase('cs').includes(query.toLocaleLowerCase('cs')));return `<section class="card"><div class="toolbar"><input class="input" aria-label="Hledat" placeholder="Hledat ve výpisu…" value="${esc(query)}" oninput="search(this.value)">${create?`<button class="primary" onclick="form('${key}')">＋ Vytvořit</button>`:''}</div>${tabs?`<div class="tabs">${tabs.map(t=>`<button class="tab ${filter===t?'active':''}" onclick="setFilter('${t}')">${t} ${t==='Vše'?data[key].length:data[key].filter(r=>r.status===t).length}</button>`).join('')}</div>`:''}${rows.length?table(rows,cols,key):'<div class="empty">Žádné záznamy k zobrazení</div>'}<p class="muted">Zobrazeno ${rows.length} z ${data[key].length} záznamů</p></section>`}function setFilter(v){filter=v;render()}function search(v){query=v;let pos=v.length;render();let x=$('[aria-label="Hledat"]');x.focus();x.setSelectionRange(pos,pos)}
function render(){document.title=page+' – Dům spolu';$('#title').textContent=page;$('#navigation').innerHTML=pages.map((p,i)=>`${i===2?'<div class="group">Oblíbené</div>':i===5?'<div class="group">Menu</div>':''}<button class="nav ${p[0]===page?'active':''}" onclick="go('${p[0]}')"><i>${p[1]}</i>${p[0]}</button>`).join('');let html;if(page==='Přehledy')html=dashboard();else if(page==='Nástěnka')html=`<div class="grid">${card('Poslední zprávy','Zobrazit zprávy','Zprávy','<div class="empty">Žádné aktuální zprávy k zobrazení</div>')}${card('Události v ukázkovém měsíci','Zobrazit kalendář','Kalendář událostí',events())}${card('Důležité kontakty','Adresář kontaktů','Adresář kontaktů','<div class="empty">Zatím nejsou přidány kontakty.</div>')}</div>`;else if(page==='Hlášení a požadavky')html=listing('reports',[['Stav','status'],['Název hlášení','name'],['Typ','type']],['Vše','Nové','V řešení','Vyřešeno','Archivované'],true);else if(page==='Diskuze')html=listing('discussions',[['Název','name'],['Stav','status'],['Vytvořeno','date']],null,false);else if(page==='Revize a termíny')html=listing('revisions',[['Název','name'],['Stav','status'],['Termín','date']],null,false);else if(page==='Kalendář událostí')html=`<section class="card"><div class="cardhead"><h2>Události · listopad 2026</h2></div>${events()}</section>`;else if(page==='Dokumenty')html=listing('docs',[['Název','name'],['Typ','status']],null,false);else html=`<section class="card"><h2>${esc(page)}</h2><p class="muted">Tato část je připravená jako orientační místo v navigaci. Její obsah a funkce zatím nejsou implementovány.</p></section>`;$('#app').innerHTML=html}
function detail(key,i){let r=data[key][i];$('#dialog').innerHTML=`<h2>${esc(r.name)}</h2>${Object.entries(r).filter(([k,v])=>k!=='name'&&v).map(([k,v])=>`<p><strong>${({status:'Stav',type:'Typ',desc:'Popis',date:'Datum',time:'Čas'})[k]||k}:</strong> ${esc(v)}</p>`).join('')}${key==='reports'?`<label>Stav<select id="status">${['Nové','V řešení','Vyřešeno','Archivované'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></label><div class="actions"><button class="secondary" onclick="dialog.close()">Zavřít</button><button class="primary" onclick="updateStatus(${i})">Uložit stav</button></div>`:'<div class="actions"><button class="secondary" onclick="dialog.close()">Zavřít</button></div>'}`;$('#dialog').showModal()}function updateStatus(i){data.reports[i].status=$('#status').value;save();$('#dialog').close();render()}function form(){ $('#dialog').innerHTML=`<h2>Nové hlášení</h2><form onsubmit="addReport(event)"><label>Název<input class="input" name="name" required maxlength="100"></label><label>Typ<select name="type"><option>Oprava</option><option>Požadavek</option><option>Jiné</option></select></label><label>Popis<textarea name="desc" rows="4"></textarea></label><div class="actions"><button type="button" class="secondary" onclick="dialog.close()">Zrušit</button><button class="primary">Uložit hlášení</button></div></form>`;$('#dialog').showModal()}function addReport(e){e.preventDefault();let f=new FormData(e.target);data.reports.unshift({name:f.get('name'),type:f.get('type'),desc:f.get('desc'),status:'Nové'});save();$('#dialog').close();filter='Vše';render()}window.addEventListener('hashchange',()=>{let p=decodeURIComponent(location.hash.slice(1));if(pages.some(x=>x[0]===p)){page=p;render()}});let p=decodeURIComponent(location.hash.slice(1));if(pages.some(x=>x[0]===p))page=p;render();
</script></body></html>
